name: SQL checks

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==2.0.0 sqlfluff==4.5.0
      - name: Lint and test changed queries
        run: |
          git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }}...HEAD -- 'queries/*.sql' > changed.txt
          cat changed.txt
          python ci/check.py $(cat changed.txt)
